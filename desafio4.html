<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 04</title>
    <style>
        .avo{
            width: 200px;
            height: 200px;
           /*  background-color: aqua; */
           display: flex;
           align-items: center;
           justify-content: center;

        }
        .pai {
            width: 100px;
            height: 100px;
             background-color: antiquewhite; 
        }
        .filho{
            width: 50px;
            height: 50px;
            background-color: aquamarine; 
        }
    </style>
</head>
<body>
    <div class="avo">  
        <div class="pai">        
            <div class="filho">
            </div>
        </div>
    </div>

    <script>
        let filho = document.querySelector('.filho')
        filho.parentNode.parentNode.style.backgroundColor = 'green'
    </script>
</body>
</html>
