<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        li{
            width: 80px;
            text-align: center;
            padding: 10px;
            text-decoration: none;
        }
    </style>
    <title>Desafio 06</title>
</head>

<body>
    <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
        <li>Item 4</li>
        <li>Item 5</li>
    </ul>
    <button class="proximo">Próximo</button>
    <script>
        let atual = document.querySelector('li')
        let proximo = document.querySelector('.proximo')

        atual.style.backgroundColor = 'yellow'

        proximo.addEventListener('click', () => {
            atual.style.backgroundColor = 'white'

            atual = atual.nextElementSibling

            if (atual == null) {
                atual.document.querySelector('li')
            }
            atual.style.background = 'yellow'
        })
    </script>

</body>

</html>
